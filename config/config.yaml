# Self-Healing Machines: Predictive Maintenance Configuration

dataset:
  name: "FD001"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_cmapss_dir: "CMAPSSData"
  schema:
    engine_id_col: "engine_id"
    cycle_col: "cycle"
    setting_cols: ["setting_1", "setting_2", "setting_3"]
    sensor_cols:
      - "sensor_1"
      - "sensor_2"
      - "sensor_3"
      - "sensor_4"
      - "sensor_5"
      - "sensor_6"
      - "sensor_7"
      - "sensor_8"
      - "sensor_9"
      - "sensor_10"
      - "sensor_11"
      - "sensor_12"
      - "sensor_13"
      - "sensor_14"
      - "sensor_15"
      - "sensor_16"
      - "sensor_17"
      - "sensor_18"
      - "sensor_19"
      - "sensor_20"
      - "sensor_21"

preprocessing:
  drop_constant_variance_threshold: 1e-4
  known_constant_sensors_fd001: ["sensor_1", "sensor_5", "sensor_6", "sensor_10", "sensor_16", "sensor_18", "sensor_19", "setting_3"]
  sensor_smoothing: "rolling_mean"
  smoothing_window: 5
  scale_features: true
  scaler_type: "standard"  # standard or minmax

feature_engineering:
  rolling_windows: [5, 10, 20]
  include_current_sensors: true
  include_rolling_mean: true
  include_rolling_std: true
  include_diff: true
  include_trend: true
  include_settings: true
  include_cycle: true

rul_labeling:
  cap_rul: true
  rul_cap_value: 125

anomaly_detection:
  model_type: "isolation_forest"
  contamination: 0.05
  n_estimators: 100
  random_state: 42
  score_threshold_warning: 0.55
  score_threshold_critical: 0.75

rul_regression:
  primary_model: "hist_gradient_boosting" # hist_gradient_boosting, random_forest, or baseline
  validation_ratio: 0.20
  random_state: 42
  models:
    baseline:
      type: "linear"
    random_forest:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1
    hist_gradient_boosting:
      max_iter: 150
      max_depth: 8
      learning_rate: 0.05
      min_samples_leaf: 20
      random_state: 42

triage:
  thresholds:
    critical_rul: 15.0
    high_rul: 30.0
    medium_rul: 60.0
  anomaly_escalation_enabled: true
  escalation_anomaly_threshold: 0.70
  safe_data_checks: true

work_orders:
  db_path: "database/work_orders.db"
  prevent_duplicates: true
  idempotent: true
  default_assignee: "Fleet Reliability Team"

mlops:
  experiment_name: "Self_Healing_Machines_CMAPSS"
  tracking_uri: "mlruns"
  artifacts_dir: "artifacts"
  models_dir: "artifacts/models"
  reports_dir: "artifacts/reports"

retraining:
  metric_to_optimize: "rmse"
  min_improvement_pct: 2.0
  max_acceptable_rmse: 30.0
